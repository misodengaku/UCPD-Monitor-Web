# Nginx configuration for UCPD-Monitor static deployment
# Place this file in /etc/nginx/sites-available/ucpd-monitor
# Then create a symlink: ln -s /etc/nginx/sites-available/ucpd-monitor /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name localhost;  # Change to your domain if needed

    # Root directory where the built files are located
    root /var/www/ucpd-monitor;
    index index.html;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Add gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}